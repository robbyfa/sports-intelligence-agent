[project]
name = "sports-intelligence-agent"
version = "2.0.0"
description = "Streaming sports intelligence agent using Kafka, LangChain, LangGraph, and RAG"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.16",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langsmith>=0.11.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
    "tavily-python>=0.7.27",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "graph/chains/tests"]
